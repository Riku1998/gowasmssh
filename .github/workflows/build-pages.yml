name: Build GoWasmSSH dist

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GoWasmSSH
        uses: actions/checkout@v5
        with:
          repository: wrtx-dev/gowasmssh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.3'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Download Go dependencies
        run: go mod download

      - name: Build WebAssembly
        run: |
          mkdir -p webpage/public

          GOOS=js GOARCH=wasm \
            go build -ldflags="-w -s" \
            -o webpage/public/ssh.wasm

          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" \
            webpage/public/wasm_exec.js

      - name: Install frontend dependencies
        working-directory: webpage
        run: pnpm install

      - name: Build frontend
        working-directory: webpage
        run: pnpm build

      - name: Check dist
        run: |
          echo "===== webpage/dist ====="
          find webpage/dist -maxdepth 2 -type f -print
          echo
          echo "===== dist size ====="
          du -sh webpage/dist

      - name: Package dist
        run: |
          cd webpage
          zip -r ../gowasmssh-dist.zip dist

      - name: Upload dist ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gowasmssh-dist
          path: gowasmssh-dist.zip
          if-no-files-found: error
