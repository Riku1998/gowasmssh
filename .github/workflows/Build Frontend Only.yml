name: Build Frontend Only (输出dist，不部署worker)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 重点：使用go 1.21，关闭toolchain，适配这个仓库Makefile
      - name: Setup Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build WASM client
        run: make client

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies & build webpage
        working-directory: ./webpage
        run: |
          pnpm install
          pnpm build

      - name: Upload dist zip
        uses: actions/upload-artifact@v4
        with:
          name: webpage-dist
          path: webpage/dist
