name: Build Frontend Only (输出dist，不部署worker)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 支持手动点按钮运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装Go，编译wasm（仓库根目录执行make client）
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build WASM client
        run: make client

      # 安装node+pnpm打包前端
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies && build webpage
        working-directory: ./webpage
        run: |
          pnpm install
          pnpm build

      # 打包dist，构建完成后下载
      - name: Upload dist zip
        uses: actions/upload-artifact@v4
        with:
          name: webpage-dist
          path: webpage/dist
